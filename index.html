<!DOCTYPE html>
<!--
  How to run:
  - Open this file directly in a browser, or
  - Run `npm install` then `npm start` and visit http://localhost:8080
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozy Garden Loop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-day">
  <div class="app">
    <header class="top-bar">
      <div class="brand">
        <h1>Cozy Garden</h1>
        <p>Daily 10-minute ritual</p>
      </div>
      <div class="meters">
        <div class="meter">
          <span class="meter-label">Garden Mood</span>
          <div class="meter-bar">
            <div id="carecharge-fill" class="meter-fill"></div>
          </div>
          <span id="carecharge-value" class="meter-value">0</span>
        </div>
        <div class="petals">Petals: <span id="petal-count">0</span></div>
      </div>
    </header>

    <section class="actions">
      <button id="water-all" class="primary">
        Water All
        <span id="water-all-cooldown" class="cooldown"></span>
      </button>
      <button id="weed-sweep" class="primary">
        Weed Sweep
        <span id="weed-sweep-cooldown" class="cooldown"></span>
      </button>
      <button id="open-daily" class="ghost">Daily Check</button>
    </section>

    <section id="pot-grid" class="pot-grid"></section>
  </div>

  <div id="daily-modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <header>
        <h2>Daily Check</h2>
        <p>Warm rituals to keep the garden glowing.</p>
      </header>
      <ul id="daily-tasks" class="task-list"></ul>
      <div id="daily-reward" class="reward"></div>
      <button id="daily-close" class="primary">Back to garden</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
